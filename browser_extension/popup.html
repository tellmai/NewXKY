<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>NewXKY 网页直连</title>
<style>body{width:330px;margin:20px;font:14px 'Microsoft YaHei',sans-serif;color:#183047}h2{font-size:19px;margin:0 0 14px}p{line-height:1.7}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bdcfd0;border-radius:8px}button{margin-top:12px;padding:10px;border:0;border-radius:8px;cursor:pointer;background:#087f70;color:white}#connect{width:100%}#disconnect{background:#66788a}#status{overflow-wrap:anywhere;color:#087f70}</style>
<h2>NewXKY 网页直连</h2><p>在 NewXKY 点击“连接浏览器”，复制连接码并粘贴到这里。连接仅用于当前答题标签页。</p>
<input id="code" aria-label="连接码" placeholder="粘贴 NewXKY 连接码" autocomplete="off">
<button id="connect">连接当前答题页</button><button id="disconnect">断开连接</button><p id="status"></p>
<p>运行时不移动系统鼠标。浏览器会显示调试连接提示；关闭开发者工具后再连接。</p><script src="popup.js"></script></html>
